[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stat-outlier-detector"
version = "0.1.0"
description = "Find the biggest NBA stat outliers from last night's games."
requires-python = ">=3.11"
dependencies = [
    "nba_api>=1.10",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nba-outliers = "outliers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
